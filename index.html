<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KETEMU - Lost & Found Kampus</title>
<style>
:root{--navy:#1e3a5f;--navy2:#16324f;--accent:#2563eb;--bg:#f6f7f9;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--border:#e5e7eb;--ok:#16a34a;--warn:#d97706}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text)}
header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10}
.logo{font-weight:800;color:var(--navy);font-size:1.2rem}
.logo span{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:var(--text);text-decoration:none;font-size:.95rem;padding:6px 4px;cursor:pointer}
nav a.active{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:600}
.btn{background:var(--navy);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--navy2)}
.btn.outline{background:none;border:1px solid var(--border);color:var(--text)}
main{max-width:1100px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#eaf1fb,#f6f7f9);border-radius:14px;padding:28px;margin-bottom:20px}
.hero h1{color:var(--navy);font-size:2rem}
.hero p{color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:130px;object-fit:cover;background:#ddd}
.card .body{padding:10px}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:6px;background:#e0e7ff;color:var(--navy);margin-bottom:6px}
.status-ditemukan{background:#dcfce7;color:var(--ok)}
.status-diverifikasi{background:#fef3c7;color:var(--warn)}
.status-dikembalikan{background:#e5e7eb;color:var(--muted)}
.meta{font-size:.75rem;color:var(--muted)}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.searchbar input,.searchbar select{padding:10px;border:1px solid var(--border);border-radius:8px;font-size:.9rem}
.searchbar input{flex:1;min-width:200px}
.section-title{font-weight:700;color:var(--navy);margin:20px 0 6px;font-size:1.1rem}
form.card{padding:18px;max-width:560px}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:.9rem}
textarea{min-height:70px;resize:vertical}
.upload-box{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted);cursor:pointer}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.radio-row{display:flex;align-items:center;gap:8px;margin:6px 0}
.msg{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:.9rem}
.msg.ok{background:#dcfce7;color:var(--ok)}
.msg.err{background:#fee2e2;color:#b91c1c}
.empty{color:var(--muted);padding:30px;text-align:center}
.item-detail{display:flex;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.item-detail img{width:110px;height:110px;object-fit:cover;border-radius:8px}
.pick{border:2px solid transparent}
.pick.sel{border-color:var(--accent)}
#loginScreen{max-width:380px;margin:80px auto;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px}
#loginScreen h1{color:var(--navy);margin-bottom:8px}
</style>
</head>
<body>

<!-- ====== LOGIN SCREEN ====== -->
<div id="loginScreen">
  <div class="logo" style="justify-content:center;display:flex;font-size:1.5rem">🔍 KETEMU</div>
  <h1 style="margin-top:16px">Lost & Found Kampus</h1>
  <p class="meta" style="margin-bottom:20px">Masuk dengan akun Google kampusmu untuk melapor atau mencari barang.</p>
  <button class="btn" onclick="signIn()" style="width:100%">Masuk dengan Google</button>
  <div id="loginMsg"></div>
</div>

<!-- ====== APP (hidden until login) ====== -->
<div id="appRoot" style="display:none">
<header>
  <div class="logo">🔍 KETEMU<span>Lost & Found Kampus</span></div>
  <nav id="nav"></nav>
  <div id="userbox" style="display:flex;align-items:center;gap:10px"></div>
</header>
<main id="app"><div class="empty">Memuat...</div></main>
</div>

<!-- ====== FIREBASE ====== -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
/* =========================================================
   1) TEMPEL KONFIGURASI FIREBASE KAMU DI SINI
   Ambil dari: Firebase Console > Project Settings > General > "Your apps"
   ========================================================= */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};

/* =========================================================
   2) DAFTAR EMAIL ADMIN (bisa lebih dari satu, pisahkan koma)
   ========================================================= */
const ADMIN_EMAILS = ["email-admin-kamu@gmail.com"];

/* ========================================================= */

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const dbf = firebase.firestore();

let me=null, isAdmin=false, items=[], claims=[];
const cat_opt=['Aksesoris','Elektronik','Kartu Identitas','Pakaian','Lainnya'];

function signIn(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{
    document.getElementById('loginMsg').innerHTML = `<div class="msg err">Gagal masuk: ${e.message}</div>`;
  });
}
function signOutUser(){ auth.signOut(); }

auth.onAuthStateChanged(user=>{
  if(user){
    me = {id:user.uid, name:user.displayName, email:user.email, photo:user.photoURL};
    isAdmin = ADMIN_EMAILS.includes(user.email);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListeners();
    render();
  } else {
    me=null; isAdmin=false;
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('appRoot').style.display='none';
  }
});

let listenersStarted=false;
function startListeners(){
  if(listenersStarted) return;
  listenersStarted=true;
  dbf.collection('items').onSnapshot(snap=>{
    items = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
  dbf.collection('claims').onSnapshot(snap=>{
    claims = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}

function nav(route){ location.hash=route; }
function renderNav(){
  const routes=[['#/beranda','Beranda'],['#/daftar','Daftar Barang'],['#/lapor','Laporkan Barang'],['#/kembalikan','Kembalikan Barang']];
  if(isAdmin) routes.push(['#/admin','⚙ Admin']);
  document.getElementById('nav').innerHTML=routes.map(r=>`<a class="${location.hash===r[0]||(!location.hash&&r[0]==='#/beranda')?'active':''}" onclick="nav('${r[0]}')">${r[1]}</a>`).join('');
  document.getElementById('userbox').innerHTML = me? `<span class="meta">👤 ${me.name}${isAdmin?' · Admin':''}</span><button class="btn outline" onclick="signOutUser()">Keluar</button>` : '';
}
function fmtDate(ts){ if(!ts) return '-'; const d=new Date(ts); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function statusBadge(s){return `<span class="badge status-${s}">${s==='ditemukan'?'Ditemukan':s==='diverifikasi'?'Diverifikasi':'Dikembalikan'}</span>`}

function itemCard(it){
  const photo=(it.photos&&it.photos[0])||'';
  return `<div class="card" onclick="nav('#/item/${it.id}')">
    <img src="${photo}" onerror="this.style.background='#ddd'">
    <div class="body">${statusBadge(it.status||'ditemukan')}
      <div style="font-weight:600">${it.name||'-'}</div>
      <div class="meta">📍 ${it.location||'-'}</div>
      <div class="meta">${fmtDate(it.createdAt)}</div>
    </div></div>`;
}

function render(){
  renderNav();
  const app=document.getElementById('app');
  const h=location.hash||'#/beranda';
  if(h==='#/beranda') return renderBeranda(app);
  if(h==='#/daftar') return renderDaftar(app);
  if(h==='#/lapor') return renderLapor(app);
  if(h==='#/kembalikan') return renderKembalikan(app);
  if(h.startsWith('#/item/')) return renderItemDetail(app,h.split('/')[2]);
  if(h==='#/admin') return isAdmin?renderAdmin(app):renderBeranda(app);
  renderBeranda(app);
}

function renderBeranda(app){
  const recent=[...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,4);
  app.innerHTML=`<div class="hero"><h1>KETEMU</h1><p>Sistem sederhana untuk membantu mahasiswa menemukan kembali barang yang hilang di lingkungan kampus.</p>
    <button class="btn" onclick="nav('#/lapor')" style="margin-top:12px">+ Laporkan Barang</button></div>
    <div class="section-title">Barang Ditemukan Terbaru</div>
    <div class="grid">${recent.length?recent.map(itemCard).join(''):'<div class="empty">Belum ada barang dilaporkan.</div>'}</div>`;
}

function renderDaftar(app){
  app.innerHTML=`<div class="searchbar">
    <select id="fcat" onchange="applyFilter()"><option value="">Semua Kategori</option>${cat_opt.map(c=>`<option>${c}</option>`).join('')}</select>
    <input id="fsearch" placeholder="Cari barang..." oninput="applyFilter()">
  </div><div class="grid" id="listgrid"></div>`;
  applyFilter();
}
function applyFilter(){
  const cat=document.getElementById('fcat')?.value||'';
  const q=(document.getElementById('fsearch')?.value||'').toLowerCase();
  let list=[...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(cat) list=list.filter(i=>i.category===cat);
  if(q) list=list.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q));
  document.getElementById('listgrid').innerHTML=list.length?list.map(itemCard).join(''):'<div class="empty">Tidak ada barang ditemukan.</div>';
}

function renderItemDetail(app,id){
  const it=items.find(i=>i.id===id);
  if(!it){app.innerHTML='<div class="empty">Barang tidak ditemukan.</div>';return;}
  app.innerHTML=`<div class="item-detail">
    <img src="${(it.photos&&it.photos[0])||''}">
    <div>${statusBadge(it.status)}<h2>${it.name}</h2>
    <div class="meta">📍 ${it.location} · ${fmtDate(it.createdAt)} ${it.foundTime||''}</div>
    <p style="margin-top:8px">${it.description||''}</p>
    <div class="meta" style="margin-top:8px">Dilaporkan oleh: ${it.reporterName||'-'}</div></div></div>
    <button class="btn outline" onclick="nav('#/daftar')">← Kembali</button>`;
}

function renderLapor(app){
  app.innerHTML=`<form class="card" onsubmit="submitLapor(event)">
    <h2 style="color:var(--navy)">Laporkan Barang Temuan</h2>
    <label>Foto Barang (maks 3)</label>
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">📷 Klik untuk unggah foto</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
    <div class="thumbs" id="thumbs"></div>
    <label>Nama Barang</label><input type="text" id="f_name" required placeholder="Contoh: Dompet, Kunci">
    <label>Kategori</label><select id="f_cat" required><option value="">Pilih Kategori</option>${cat_opt.map(c=>`<option>${c}</option>`).join('')}</select>
    <label>Lokasi Penemuan</label><input type="text" id="f_loc" required placeholder="Contoh: Gedung A3">
    <label>Tanggal & Waktu</label>
    <div style="display:flex;gap:8px"><input type="date" id="f_date" required><input type="time" id="f_time"></div>
    <label>Deskripsi</label><textarea id="f_desc" placeholder="Warna, merek, ciri khusus..."></textarea>
    <label>Lokasi Penyimpanan</label>
    <div class="radio-row"><input type="radio" name="store" value="Simpan Sendiri" checked><span>Simpan Sendiri</span></div>
    <div class="radio-row"><input type="radio" name="store" value="Titipkan"><span>Titipkan ke Pos/Fakultas</span></div>
    <div id="msgbox"></div>
    <button class="btn" type="submit" style="margin-top:14px">Kirim Laporan</button>
  </form>`;
}
let pendingPhotos=[];
// Foto tidak diupload ke server terpisah (Firebase Storage butuh paket berbayar).
// Sebagai gantinya, foto dikecilkan lalu disimpan sebagai teks (base64) langsung di dokumen Firestore.
function compressImage(file, maxDim=500, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
        else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
        const canvas=document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handleFiles(e){
  const files=[...e.target.files].slice(0,3);
  document.getElementById('thumbs').innerHTML='Memproses foto...';
  pendingPhotos=[];
  for(const f of files){
    try{ pendingPhotos.push(await compressImage(f)); }
    catch(err){ console.error(err); }
  }
  document.getElementById('thumbs').innerHTML=pendingPhotos.map(u=>`<img src="${u}">`).join('')||'Gagal memproses foto.';
}
async function submitLapor(e){
  e.preventDefault();
  const box=document.getElementById('msgbox');
  try{
    await dbf.collection('items').add({
      name:document.getElementById('f_name').value,
      category:document.getElementById('f_cat').value,
      location:document.getElementById('f_loc').value,
      foundDate:document.getElementById('f_date').value,
      foundTime:document.getElementById('f_time').value,
      description:document.getElementById('f_desc').value,
      storageMethod:document.querySelector('input[name=store]:checked').value,
      photos:pendingPhotos,
      reporterId: me.id,
      reporterName: me.name,
      status:'ditemukan',
      createdAt: Date.now()
    });
    box.innerHTML='<div class="msg ok">Laporan berhasil dikirim!</div>';
    pendingPhotos=[];
    setTimeout(()=>nav('#/daftar'),800);
  }catch(err){ box.innerHTML='<div class="msg err">Gagal mengirim: '+err.message+'</div>'; }
}

let selectedItemId=null;
function renderKembalikan(app){
  const found=items.filter(i=>i.status==='ditemukan');
  app.innerHTML=`<h2 style="color:var(--navy)">Verifikasi & Pengembalian Barang</h2>
  <div class="section-title">1. Pilih Barang Terlapor</div>
  <div class="grid" id="pickgrid">${found.map(i=>`<div class="card pick" id="pick_${i.id}" onclick="selectItem('${i.id}')"><img src="${(i.photos&&i.photos[0])||''}"><div class="body"><div style="font-weight:600">${i.name}</div><div class="meta">📍 ${i.location}</div></div></div>`).join('')||'<div class="empty">Tidak ada barang menunggu verifikasi.</div>'}</div>
  <form class="card" style="margin-top:16px" onsubmit="submitKembalikan(event)">
    <label>Deskripsi Bukti Kepemilikan</label><textarea id="k_desc" required placeholder="Ciri-ciri detail yang membuktikan kepemilikan"></textarea>
    <label>Metode Pengembalian</label>
    <select id="k_method"><option>Ambil di Pos</option><option>Ambil di Fakultas</option><option>COD (Serah Terima Langsung)</option></select>
    <label>Catatan Tambahan</label><textarea id="k_note" placeholder="Opsional"></textarea>
    <div id="kmsg"></div>
    <button class="btn" type="submit" style="margin-top:14px">Kirim Klaim</button>
  </form>`;
}
function selectItem(id){ selectedItemId=id; document.querySelectorAll('.pick').forEach(el=>el.classList.remove('sel')); document.getElementById('pick_'+id)?.classList.add('sel'); }
async function submitKembalikan(e){
  e.preventDefault();
  const box=document.getElementById('kmsg');
  if(!selectedItemId){ box.innerHTML='<div class="msg err">Pilih barang terlebih dahulu.</div>'; return; }
  try{
    await dbf.collection('claims').add({
      itemId:selectedItemId,
      claimantDescription:document.getElementById('k_desc').value,
      returnMethod:document.getElementById('k_method').value,
      note:document.getElementById('k_note').value,
      claimantId: me.id,
      claimantName: me.name,
      createdAt:Date.now()
    });
    await dbf.collection('items').doc(selectedItemId).update({status:'diverifikasi'});
    box.innerHTML='<div class="msg ok">Klaim terkirim! Menunggu verifikasi admin/pelapor.</div>';
    setTimeout(()=>nav('#/daftar'),900);
  }catch(err){ box.innerHTML='<div class="msg err">Gagal mengirim klaim: '+err.message+'</div>'; }
}

function renderAdmin(app){
  const rows=[...items].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  app.innerHTML=`<h2 style="color:var(--navy)">Panel Admin</h2>
  <div class="section-title">Semua Laporan Barang (${rows.length})</div>
  ${rows.map(it=>{
    const itClaims=claims.filter(c=>c.itemId===it.id);
    return `<div class="item-detail" style="align-items:flex-start">
      <img src="${(it.photos&&it.photos[0])||''}">
      <div style="flex:1;min-width:200px">
        ${statusBadge(it.status)}
        <div style="font-weight:600">${it.name} <span class="meta">(${it.category||'-'})</span></div>
        <div class="meta">📍 ${it.location} · ${fmtDate(it.createdAt)} · oleh ${it.reporterName||'-'}</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn outline" onclick="adminSetStatus('${it.id}','ditemukan')">Set: Ditemukan</button>
          <button class="btn outline" onclick="adminSetStatus('${it.id}','diverifikasi')">Set: Diverifikasi</button>
          <button class="btn" onclick="adminSetStatus('${it.id}','dikembalikan')">Tandai Dikembalikan</button>
          <button class="btn outline" style="color:#b91c1c" onclick="adminDeleteItem('${it.id}')">Hapus</button>
        </div>
        ${itClaims.length?`<div class="meta" style="margin-top:8px;font-weight:600">Klaim masuk (${itClaims.length}):</div>
        ${itClaims.map(c=>`<div style="border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px">
          <div class="meta">Oleh: ${c.claimantName||'-'} · ${c.returnMethod||'-'}</div>
          <div style="font-size:.85rem">${c.claimantDescription||''}</div>
        </div>`).join('')}`:''}
      </div></div>`;
  }).join('')||'<div class="empty">Belum ada laporan.</div>'}`;
}
async function adminSetStatus(id,status){
  try{ await dbf.collection('items').doc(id).update({status}); }catch(e){ alert('Gagal: '+e.message); }
}
async function adminDeleteItem(id){
  if(!confirm('Hapus laporan ini?')) return;
  try{ await dbf.collection('items').doc(id).delete(); }catch(e){ alert('Gagal menghapus: '+e.message); }
}

window.addEventListener('hashchange',render);
</script>
</body>
</html>
